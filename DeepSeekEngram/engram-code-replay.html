<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DeepSeek V4.1 Flash · Engram · Mobile</title>
<style>
:root{color-scheme:dark;--bg:#10151c;--panel:#1a232e;--panel2:#142029;--line:#354453;--ink:#ecf2f7;--muted:#a7b6c3;--mint:#85e3c7;--purple:#a9bcff;--gold:#f4c779;--pink:#eaa4d2;--blue:#76b8f5;--coral:#ff927b}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,sans-serif}button,input{font:inherit}button{min-height:44px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:9px;cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid var(--mint);outline-offset:3px}button:disabled{opacity:.3}
main{width:min(100%,760px);margin:auto;padding:20px 18px 34px}header strong{font-size:20px}.example{margin-top:18px}.example>p{margin:0 0 12px}.tokens{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.token{display:grid;place-items:center;padding:9px 5px;background:var(--panel);border:1px solid var(--line);border-radius:8px}.token b{font-weight:500}.token code{color:var(--mint);font-size:13px}
.player{position:sticky;top:0;z-index:10;margin:20px -6px 0;padding:10px 6px;background:rgba(16,21,28,.96);backdrop-filter:blur(9px);border-bottom:1px solid var(--line)}.player-row{display:grid;grid-template-columns:48px 1fr 48px auto;gap:8px;align-items:center}#play{background:var(--mint);color:#11271f;font-weight:700}#count{color:var(--muted);font-size:14px;white-space:nowrap}.scrub{display:block;width:100%;margin:10px 0 2px;accent-color:var(--mint)}nav{display:flex;gap:8px;overflow-x:auto;padding:12px 0 8px;scrollbar-width:none}nav::-webkit-scrollbar{display:none}nav button{flex:0 0 auto;padding:8px 13px;white-space:nowrap;font-size:14px}nav button.active{color:var(--mint);border-color:var(--mint)}
h1{font-size:26px;line-height:1.18;margin:26px 0 10px}#description{color:var(--muted);margin:0 0 20px}.focus,.callout{padding:11px 13px;background:#18231f;border-left:3px solid var(--mint);border-radius:0 7px 7px 0}.focus{margin:0 0 18px}.callout{margin:16px 0;border:1px solid #536474;border-left:3px solid var(--mint)}.stage{display:grid;gap:15px}.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}.label{display:block;color:var(--muted);font-size:13px;margin-bottom:8px}.down{text-align:center;color:var(--mint);font-size:25px;line-height:1}.flow-card{display:grid;gap:12px}.ngram-2{--ngram:var(--mint)}.ngram-3{--ngram:var(--purple)}.ngram-4{--ngram:var(--gold)}.order{color:var(--ngram);font-weight:700}.pill-row,.math-row{display:flex;align-items:center;justify-content:center;gap:7px;flex-wrap:wrap}.pill{padding:6px 9px;background:var(--panel2);border:1px solid var(--line);border-radius:6px}.id{color:var(--mint);font-family:ui-monospace,monospace}.weight.w0{color:var(--mint)}.weight.w1{color:var(--purple)}.weight.w2{color:var(--gold)}.weight.w3{color:#efa6d3}.result{min-width:38px;padding:6px 8px;border:1px solid currentColor;border-radius:6px;background:#111920;font:700 15px ui-monospace,monospace}.r0{color:var(--mint)}.r1{color:var(--purple)}.r2{color:var(--gold)}.r3{color:#efa6d3}.xor{color:var(--coral);font-weight:800}.hash{display:grid;place-items:center;min-width:74px;min-height:62px;margin:auto;border:1px solid var(--ngram);border-radius:9px}.hash small{color:var(--muted)}.hash strong{color:var(--ngram);font:24px ui-monospace,monospace}
.per-token-strip{display:grid;grid-template-columns:repeat(var(--count),minmax(0,1fr));gap:8px;padding:3px 1px 8px}.token-product{min-width:0;padding:8px 6px;background:var(--panel2);border:1px solid var(--line);border-radius:7px;text-align:center;font-size:13px}.token-product strong{display:flex;align-items:center;justify-content:center;gap:5px;flex-wrap:wrap;font:700 15px ui-monospace,monospace;margin-top:3px}.token-product small{display:block;color:var(--muted);line-height:1.25}.hash.compact{display:inline-grid;margin:0 0 0 3px;min-width:76px;min-height:58px}.combine-row{gap:7px}
.lookup-card{border-color:var(--ngram)}.lookup-path{display:grid;gap:10px}.memory{display:grid;gap:9px;padding:13px;background:var(--panel2);border:1px solid var(--ngram);border-radius:9px}.head{display:grid;grid-template-columns:48px 1fr;align-items:center;gap:8px}.head small{font-size:10px;white-space:nowrap}.rows{display:flex;gap:5px}.rows i{height:24px;flex:1;max-width:34px;border-radius:3px;background:#3d4b50}.rows i.picked{background:var(--ngram);outline:1px solid var(--ngram);outline-offset:2px}.retrieved{display:flex;justify-content:center;gap:5px}.retrieved i,.vector i{width:13px;height:34px;border-radius:3px;background:var(--ngram)}.retrieved i:nth-child(even){opacity:.5}.concat{border-color:var(--mint);text-align:center}.segments{display:flex;gap:4px;padding:8px;background:var(--panel2);border:1px solid var(--mint);border-radius:7px}.segments i{height:38px;flex:1;border-radius:2px}.segments i:nth-child(-n+4){background:var(--mint)}.segments i:nth-child(n+5):nth-child(-n+8){background:var(--purple)}.segments i:nth-child(n+9){background:var(--gold)}.symbol{margin-top:9px;color:var(--mint);font:700 18px ui-monospace,monospace}
.ngram-compare{padding:6px 15px}.ngram-row{display:grid;grid-template-columns:76px minmax(0,1fr);gap:10px;padding:14px 0;border-bottom:1px solid var(--line)}.ngram-row:last-child{border-bottom:0}.ngram-row>.order{white-space:nowrap}.ngram-pairs{display:grid;grid-template-columns:repeat(var(--count),minmax(0,1fr));gap:6px;min-width:0}.ngram-pair{display:grid;grid-template-rows:auto auto;gap:7px;min-width:0;text-align:center}.ngram-pair .pill{min-width:0;padding:4px 5px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ngram-pair .current{border-color:var(--mint);color:var(--mint)}.ngram-pair code{display:grid;place-items:center;width:100%;height:29px;border-radius:5px;background:#111920;color:var(--mint)}.growth-note{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:2px;color:var(--muted);font-size:13px}.growth-note b{color:var(--mint)}
.tensor{display:grid;gap:7px;text-align:center}.vector{display:flex;align-items:center;gap:4px;height:58px;padding:7px;background:#141d27;border:1px solid var(--line);border-radius:7px}.vector i{display:block;flex:1;width:auto}.vector.blue i{background:var(--blue)}.vector.pink i{background:var(--pink)}.vector.mix i{background:linear-gradient(180deg,var(--blue) 0 58%,var(--pink) 58%)}.vector i:nth-child(1){height:28px}.vector i:nth-child(2){height:42px}.vector i:nth-child(3){height:34px}.vector i:nth-child(4){height:47px}.vector i:nth-child(5){height:31px}.vector i:nth-child(6){height:39px}.equation{display:flex;align-items:center;justify-content:center;gap:7px;flex-wrap:wrap;padding:13px;background:var(--panel2);border:1px solid #4a5b68;border-radius:9px;text-align:center;font:14px/1.5 ui-monospace,monospace}.node{padding:6px 8px;border:1px solid #4a5b68;border-radius:5px}.m{color:var(--mint)}.x{color:#58c7f3}.k{color:#b497ff}.v{color:var(--gold)}.s{color:#ffca6a}.g{color:var(--coral)}.gv{color:var(--pink)}.op{color:var(--mint);font-weight:800}.io{font-size:13px;color:var(--muted);font-weight:700}.inject{display:grid;gap:9px}.operator{color:var(--mint);font-size:25px;text-align:center}.fox{background:var(--mint);color:#11271f}.sentence{display:flex;gap:7px;flex-wrap:wrap;justify-content:center}.sentence span{padding:6px 9px;background:var(--panel);border-radius:6px}.sentence .fox{background:var(--mint)}footer{margin-top:28px;padding-top:14px;border-top:1px solid var(--line);color:var(--muted);font-size:13px}
@media(min-width:721px){main{padding:28px}.tokens{grid-template-columns:repeat(6,1fr)}.player{position:static;margin-top:24px}.lookup-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.lookup-grid+.down{margin-top:4px}.inject{grid-template-columns:1fr auto 1fr auto 1fr;align-items:center}.operator{transform:none}}
@media(max-width:420px){.ngram-row{grid-template-columns:1fr}.ngram-row>.order{margin-bottom:2px}.token-product{font-size:11px}.token-product strong{font-size:13px;gap:3px}.token-product .result{min-width:31px;padding:4px}}
</style>
</head>
<body><main>
<header><strong>DeepSeek V4.1 Flash · Engram</strong></header>
<section class="example" id="example"><p>Example: <strong>the quick brown fox jumps over</strong></p><div class="tokens" aria-label="Words and toy token IDs"></div></section>
<section class="player" aria-label="Playback controls"><div class="player-row"><button id="prev" aria-label="Previous step">←</button><button id="play">▶ Play</button><button id="next" aria-label="Next step">→</button><span id="count" aria-live="polite"></span></div><input class="scrub" id="scrub" type="range" min="0" max="4" value="0" aria-label="Current step"><nav id="nav" aria-label="Steps"></nav></section>
<h1 id="title"></h1><p id="description"></p><p class="focus" id="focus">We will follow the transformation of <strong>fox</strong> through Engram.</p><section id="visual"></section>
<footer>Teaching example with small token IDs and hash values. Vector bars are symbolic.</footer>
</main>
<script>
const words=[['the',1],['quick',2],['brown',3],['fox',4],['jumps',5],['over',6]];
const $=id=>document.getElementById(id);const down='<div class="down" aria-hidden="true">↓</div>';const vector=(kind,label)=>'<div class="tensor"><div class="vector '+kind+'">'+Array.from({length:6},()=>'<i></i>').join('')+'</div><small>'+label+'</small></div>';const sentence=()=>'<div class="sentence">'+words.map(([w])=>'<span class="'+(w==='fox'?'fox':'')+'">'+w+'</span>').join('')+'</div>';const segments=()=>'<div class="segments">'+Array.from({length:12},()=>'<i></i>').join('')+'</div>';
const ngramRow=(order,text,ids)=>{const rowWords=text.split(' ');return '<div class="ngram-row ngram-'+order+'"><strong class="order">'+order+'-gram</strong><div class="ngram-pairs" style="--count:'+rowWords.length+'">'+rowWords.map((word,i)=>'<div class="ngram-pair"><span class="pill '+(word==='fox'?'current':'')+'">'+word+'</span><code>'+ids[i]+'</code></div>').join('')+'</div></div>'};
const weights=[3,5,7,11];const hashCard=(order,tokens)=>{const p=tokens.map(([,id],i)=>id*weights[i]),h=p.reduce((a,b)=>a^b);return '<article class="card flow-card ngram-'+order+'"><strong class="order">'+order+'-gram</strong><div><span class="label">Step 1 · Per-token positional hash</span><div class="per-token-strip" style="--count:'+tokens.length+'">'+tokens.map(([word,id],i)=>'<div class="token-product"><small>'+word+' · token ID '+id+'</small><strong>'+id+' × <b class="weight w'+i+'">'+weights[i]+'</b> → <span class="result r'+i+'">'+p[i]+'</span></strong></div>').join('')+'</div></div>'+down+'<div><span class="label">Step 2 · Combine products</span><div class="math-row combine-row">'+p.map((x,i)=>'<span class="result r'+i+'">'+x+'</span>').join('<span class="xor">XOR</span>')+'<span class="op">→</span><span class="hash compact"><small>n-gram hash</small><strong>'+h+'</strong></span></div></div></article>'};
const picks=[[4,1],[0,3],[2,4]];const lookup=(order,hash,index)=>'<article class="card lookup-card ngram-'+order+'"><div class="lookup-path"><div class="hash"><small>'+order+'-gram hash</small><strong>'+hash+'</strong></div>'+down+'<div class="memory"><strong class="order">'+order+'-gram memory</strong>'+[0,1].map(head=>'<div class="head"><small>Head '+(head+1)+'</small><div class="rows">'+Array.from({length:5},(_,i)=>'<i class="'+(i===picks[index][head]?'picked':'')+'"></i>').join('')+'</div></div>').join('')+'</div>'+down+'<div><span class="label">retrieved memory vectors</span><div class="retrieved">'+Array.from({length:8},()=>'<i></i>').join('')+'</div></div></div></article>';
const steps=[
{name:'1 · N-grams',title:'Take the n-grams ending at fox',desc:'Look back up to three words. Every n-gram includes the current token.',view:()=>'<article class="card ngram-compare">'+ngramRow(2,'brown fox',[3,4])+ngramRow(3,'quick brown fox',[2,3,4])+ngramRow(4,'the quick brown fox',[1,2,3,4])+'</article><div class="growth-note"><span>older context grows</span><b>2 → 3 → 4 words</b></div>'},
{name:'2 · Product & hash',title:'Turn each n-gram into a hash',desc:'Every token is first given a position-specific product; XOR then combines those products into one n-gram address.',view:()=>'<article class="card flow-card"><strong>Generic template</strong><div><span class="label">Step 1 · Per-token positional hash</span><div class="equation"><span class="node">token ID<sub>i</sub></span><span>×</span><span class="node">position weight<sub>i</sub></span><span class="op">→</span><span class="node">product<sub>i</sub></span></div></div>'+down+'<div><span class="label">Step 2 · Combine products into an n-gram hash</span><div class="equation"><span class="node">product<sub>1</sub></span><span class="xor">XOR</span><span class="node">product<sub>2</sub></span><span class="xor">XOR</span><span>…</span><span class="op">→</span><span class="node">n-gram hash</span></div></div></article><div class="callout">Example position weights: <b class="weight w0">3</b>, <b class="weight w1">5</b>, <b class="weight w2">7</b>, <b class="weight w3">11</b>.<br><small>In DeepSeek V4.1 Flash, layer-specific random odd integers are generated from a fixed seed, so they are deterministic, frozen, and not learned.</small></div><div class="stage">'+hashCard(2,[['fox',4],['brown',3]])+hashCard(3,[['fox',4],['brown',3],['quick',2]])+hashCard(4,[['fox',4],['brown',3],['quick',2],['the',1]])+'</div>'},
{name:'3 · Lookup',title:'Use the hashes to retrieve memory',desc:'Each hash selects one learned memory row per head.',view:()=>'<div class="lookup-grid">'+lookup(2,3,0)+lookup(3,13,1)+lookup(4,6,2)+'</div>'+down+'<article class="card concat"><strong>Concatenate memory vectors</strong><span class="label">2-gram · 3-gram · 4-gram</span>'+segments()+'<div class="symbol">Memory m</div></article><div class="callout">DeepSeek V4.1 Flash uses <strong>8 heads</strong> per n-gram. Two representative heads are shown.</div>'},
{name:'4 · Transform & gate',title:'Let the hidden state control the memory',desc:'Project memory into a key and value, then use the hidden state to decide how much value to pass.',view:()=>'<div class="stage"><span class="io">Input:</span><article class="card">'+segments()+'<div class="symbol">memory m</div><div style="height:14px"></div>'+vector('blue','hidden state x')+'</article>'+down+'<div class="equation"><span class="node m">m</span><span class="op">→</span><span class="node">linear projection<br>[K; V] = m × W<sub>KV</sub><sup>T</sup></span><span class="op">→</span><span class="node k">K</span><span class="node v">V</span></div>'+down+'<div class="equation"><span class="node x">x</span><span class="node k">K</span><span class="op">→</span><span>norm-dot(x, K)</span><span class="op">→</span><span class="node s">s</span></div>'+down+'<div class="equation"><span class="node s">s</span><span class="op">→</span><span>σ(sign(s)√|s|)</span><span class="op">→</span><span class="node g">g</span></div>'+down+'<div class="equation"><span class="node g">g</span><span>×</span><span class="node v">V</span><span class="op">→</span><span class="node gv">gV</span></div>'+down+'<span class="io">Output:</span><article class="card">'+vector('pink','gated memory')+'<div class="symbol" style="color:var(--pink)">gV</div></article></div>'},
{name:'5 · Inject',title:'Add the memory at fox’s position',desc:'Add the gated memory vector to the hidden state, then continue through the transformer.',view:()=>sentence()+'<div style="height:16px"></div><div class="inject"><article class="card">'+vector('blue','hidden state')+'<div class="symbol" style="color:var(--blue)">x</div></article><div class="operator">+</div><article class="card">'+vector('pink','gated memory')+'<div class="symbol" style="color:var(--pink)">gV</div></article><div class="operator">=</div><article class="card">'+vector('mix','updated hidden state')+'<div class="symbol">x′ = x + gV</div></article></div>'}
];
let current=0,playing=false,timer;function render(){const step=steps[current];$('example').hidden=current>=2;$('focus').hidden=current!==0;$('title').textContent=step.title;$('description').textContent=step.desc;$('visual').innerHTML=step.view();$('count').textContent=(current+1)+' / '+steps.length;$('scrub').value=current;$('prev').disabled=current===0;$('next').disabled=current===steps.length-1;$('nav').innerHTML=steps.map((s,i)=>'<button data-step="'+i+'" class="'+(i===current?'active':'')+'" aria-current="'+(i===current?'step':'false')+'">'+s.name+'</button>').join('');document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>go(Number(b.dataset.step)));const active=document.querySelector('.active');if(active)active.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'})}function stop(){playing=false;clearTimeout(timer);$('play').textContent='▶ Play'}function go(i){stop();current=Math.max(0,Math.min(steps.length-1,i));render()}function tick(){timer=setTimeout(()=>{if(!playing)return;if(current===steps.length-1){stop();return}current++;render();tick()},8000)}function toggle(){if(playing){stop();return}if(current===steps.length-1)current=0;playing=true;$('play').textContent='Ⅱ Pause';render();tick()}$('prev').onclick=()=>go(current-1);$('next').onclick=()=>go(current+1);$('play').onclick=toggle;$('scrub').oninput=e=>go(Number(e.target.value));document.addEventListener('keydown',e=>{if(['BUTTON','INPUT'].includes(e.target.tagName))return;if(e.key==='ArrowRight')go(current+1);if(e.key==='ArrowLeft')go(current-1);if(e.code==='Space'){e.preventDefault();toggle()}});document.querySelector('.tokens').innerHTML=words.map(([w,id])=>'<div class="token"><b>'+w+'</b><code>ID '+id+'</code></div>').join('');render();
</script></body></html>
