margin-top:14px}.vectors i{height:40px;width:12px;background:var(--accent);border-radius:3px}.vectors i:nth-child(2n){opacity:.4}.block{background:#1e3431;border:1px solid var(--accent);border-radius:14px;padding:24px;text-align:center}.inside{display:grid;gap:10px;margin-top:20px}.inside div{border-radius:7px;padding:12px;background:#142623}.bottom{text-align:center;color:var(--muted);margin:28px 0 0;font-size:15px}footer{border-top:1px solid var(--line);margin-top:30px;padding-top:15px;color:var(--muted);font-size:13px}@media(max-width:700px){main{padding:18px}header{flex-wrap:wrap}.row{grid-template-columns:65px 1fr;gap:10px}.row>.arrow{display:none}.row>.box:last-child{grid-column:2}.flow{grid-template-columns:1fr}.flow>.arrow{transform:rotate(90deg)}h1{font-size:26px}.controls{gap:7px}.controls button{padding:8px 10px}nav button{flex:auto}.stage{min-height:0}}

.signal-stack{display:grid;gap:18px}.signal{display:grid;gap:7px}.signal>small{text-align:center}.state-vector{display:flex;align-items:center;gap:4px;height:58px;padding:7px;background:#141d27;border:1px solid var(--line);border-radius:6px}.state-vector i{display:block;flex:1;border-radius:2px}.state-vector.hidden i{background:#76b8f5}.state-vector.gated i{background:#eaa4d2}.state-vector.updated i{background:linear-gradient(180deg,#76b8f5 0 58%,#eaa4d2 58% 100%)}.state-vector i:nth-child(1){height:28px}.state-vector i:nth-child(2){height:42px}.state-vector i:nth-child(3){height:34px}.state-vector i:nth-child(4){height:47px}.state-vector i:nth-child(5){height:31px}.state-vector i:nth-child(6){height:39px}.state-vector.gated{height:58px}.state-vector.gated i:nth-child(1){height:14px}.state-vector.gated i:nth-child(2){height:26px}.state-vector.gated i:nth-child(3){height:19px}.state-vector.gated i:nth-child(4){height:31px}.state-vector.gated i:nth-child(5){height:17px}.state-vector.gated i:nth-child(6){height:23px}.inject-flow .box{padding:18px 14px}.output-symbol{color:#eaa4d2;font:700 21px ui-monospace,monospace;margin-bottom:10px}
.gate-flow{grid-template-columns:.85fr 28px 1.8fr 28px .8fr}.gate-block{padding:18px 14px}.gate-graph{display:grid;gap:14px;margin-top:12px}.gate-path{display:flex;align-items:center;justify-content:center;gap:7px;flex-wrap:wrap}.gate-path b{color:var(--accent);font-weight:500}.gate-node,.split-node{padding:7px 9px;border:1px solid #4a5b68;border-radius:6px;background:#152029;font:14px ui-monospace,monospace}.gate-node i,.split-node i{font-style:italic}.split-node,.input-pair{display:flex;gap:5px}.input-pair{padding:5px;border:1px solid #4a5b68;border-radius:7px;background:#111920}.split-node i{padding:2px 8px;border-radius:3px}.split-node i:first-child,.key-node{color:#b497ff;border-color:#7563a8}.split-node i:last-child{color:#f4c779}.raw-value-node{color:#f4c779;border-color:#9b7e4b}.hidden-node{color:#58c7f3;border-color:#397f9c}.memory-node{color:#85e3c7;border-color:#6caf9e}.math-node{color:#f4c779}.value-node{color:#eaa4d2;border-color:#986c89}.compare{padding:11px 0;border-top:1px solid #385049;border-bottom:1px solid #385049}.scalar-node{min-width:34px;font-weight:700}.s-node{color:#ffca6a;border-color:#a17d3d}.g-node{color:#ff927b;border-color:#a25c4d}.result-row{justify-content:flex-end;padding-top:10px;border-top:1px solid #385049}.result-row .value-node{font-weight:700}@media(max-width:700px){.gate-flow{grid-template-columns:1fr}}
.tensor-name{color:#eaa4d2;font:700 21px ui-monospace,monospace;margin:10px 0 0}.inject-flow .box:first-child .tensor-name{color:#58c7f3}.inject-flow .box:last-child .tensor-name{color:var(--accent)}

.lookup-matrix{display:grid;grid-template-columns:.72fr 28px 1.25fr 28px 1.15fr;gap:12px;align-items:center}.lookup-column{display:grid;gap:12px}.hash-card,.memory-card{min-height:112px;padding:13px;border:1px solid var(--line);border-radius:9px;background:var(--panel);text-align:center}.ngram-2{--ngram:#85e3c7}.ngram-3{--ngram:#a9bcff}.ngram-4{--ngram:#f4c779}.hash-card{display:grid;place-content:center;border-color:var(--ngram)}.hash-card small{display:block}.hash-card strong{color:var(--ngram);font:24px ui-monospace,monospace}.memory-card{border-color:var(--ngram)}.memory-card>strong{display:block;margin-bottom:8px;color:var(--ngram);font-size:14px}.mini-head{display:grid;grid-template-columns:46px 1fr;align-items:center;gap:7px;margin-top:6px}.mini-head small{font-size:10px;white-space:nowrap}.mini-rows{display:flex;gap:5px}.mini-rows i{height:22px;flex:1;border-radius:3px;background:#3d4b50}.mini-rows i.picked{background:var(--ngram);outline:1px solid var(--ngram);outline-offset:2px}@media(max-width:700px){.lookup-matrix{grid-template-columns:1fr}.lookup-matrix>.arrow{transform:rotate(90deg)}}
.concat-operation{margin-bottom:12px;font-weight:700}.memory-label{margin-top:12px;color:var(--accent);font:700 18px ui-monospace,monospace}.io-group{display:grid;gap:7px}.io-label{text-align:left;font-size:14px;color:var(--muted)}
</style></head><body><main>
<header><strong>DeepSeek V4.1 Flash · Engram</strong></header>
<section class="example" id="example" aria-label="Example sentence and token IDs"><p>Example: <strong>the quick brown fox jumps over</strong></p><div class="token-table-wrap"><table class="token-table" aria-label="Words and their toy token IDs"><tbody><tr><th scope="row">Word</th><th scope="col">the</th><th scope="col">quick</th><th scope="col">brown</th><th scope="col">fox</th><th scope="col">jumps</th><th scope="col">over</th></tr><tr><th scope="row">Token ID</th><td>1</td><td>2</td><td>3</td><td>4</td><td>5</td><td>6</td></tr></tbody></table></div></section>
<div class="controls"><button id="prev" aria-label="Previous step">←</button><button id="play">▶ Play</button><button id="next" aria-label="Next step">→</button><span id="count" aria-live="polite"></span><input id="scrub" type="range" min="0" max="4" value="0" aria-label="Current step"></div>
<nav id="nav" aria-label="Steps"></nav><h1 id="title"></h1><p id="description"></p><p id="follow-note" class="focus-note">We will follow the transformation of <strong>fox</strong> through Engram.</p><section id="visual" aria-label="Engram computation"></section>
<footer>Teaching example with small token IDs and hash values. Vector bars are symbolic.</footer>
</main><script>
const sentence=()=>'<div class="sentence">'+['the','quick','brown','fox','jumps','over'].map(w=>'<span class="word '+(w==='fox'?'selected':'')+'">'+w+'</span>').join('')+'</div>';
const bars=()=>'<div class="vectors" aria-label="memory vector">'+Array.from({length:8},()=>'<i></i>').join('')+'</div>';
const box=(label,body,extra='')=>'<div class="box '+extra+'"><span class="label">'+label+'</span>'+body+'</div>';
const ioBox=(label,body,extra='')=>'<div class="io-group"><strong class="io-label">'+label+':</strong><div class="box '+extra+'">'+body+'</div></div>';
const arrow='<div class="arrow" aria-hidden="true">→</div>';
const weighted=(v,i)=>'<span class="weight w'+i+'">'+v+'</span>';
const productBlock=(v,i)=>'<span class="product-value p'+i+'">'+v+'</span>';
let lookupFocus=0;
const signalVector=(kind,label)=>'<div class="signal"><div class="state-vector '+kind+'" aria-label="'+label+'">'+Array.from({length:6},()=>'<i></i>').join('')+'</div><small>'+label+'</small></div>';
const combinedVector=(compact=false)=>'<div class="'+(compact?'memory-input':'concat-visual')+'">'+(compact?'':'<div class="concat-source"><small>2-gram</small><span class="concat-segment">'+Array.from({length:4},()=>'<i></i>').join('')+'</span></div><div class="concat-source"><small>3-gram</small><span class="concat-segment">'+Array.from({length:4},()=>'<i></i>').join('')+'</span></div><div class="concat-source"><small>4-gram</small><span class="concat-segment">'+Array.from({length:4},()=>'<i></i>').join('')+'</span></div><div class="join-lines"></div>')+'<div class="joined-vector" aria-label="Combined vector with segments from the 2-gram, 3-gram, and 4-gram">'+Array.from({length:12},()=>'<i></i>').join('')+'</div>'+(compact?'<small>memory <i>m</i></small>':'')+'</div>';
const memoryTables=()=>'<div class="memory-stack"><div class="memory-back" aria-hidden="true"></div><div class="memory-back near" aria-hidden="true"></div><div class="memory-front"><span class="label">'+(lookupFocus+2)+'-gram memory tables</span>'+[0,1].map(h=>'<div class="head-memory"><small>Head '+(h+1)+'</small><div class="table-bars" aria-label="Five schematic table rows, one selected">'+Array.from({length:5},(_,i)=>'<span class="'+(i===(lookupFocus+h+1)%5?'picked':'')+'"></span>').join('')+'</div></div>').join('')+'<div class="selection-key">Bright bar = selected row</div></div></div>';
const lookupRows=[[4,1],[0,3],[2,4]];
const memoryTableCard=(order,index)=>'<div class="memory-card ngram-'+order+'"><strong>'+order+'-gram memory</strong><div class="mini-head"><small>Head 1</small><div class="mini-rows">'+Array.from({length:5},(_,i)=>'<i class="'+(i===lookupRows[index][0]?'picked':'')+'"></i>').join('')+'</div></div><div class="mini-head"><small>Head 2</small><div class="mini-rows">'+Array.from({length:5},(_,i)=>'<i class="'+(i===lookupRows[index][1]?'picked':'')+'"></i>').join('')+'</div></div></div>';
const steps=[
{name:'1 · N-grams',title:'Take the n-grams ending at fox',description:'Look back up to three words. Every n-gram includes the current token.',view:()=>sentence()+'<div class="rows">'+[['2-gram','brown fox','3, 4'],['3-gram','quick brown fox','2, 3, 4'],['4-gram','the quick brown fox','1, 2, 3, 4']].map(([n,s,ids])=>'<div class="row"><span>'+n+'</span>'+box('words',s)+arrow+box('toy token IDs','<span class="number">['+ids+']</span>')+'</div>').join('')+'</div>'},
{name:'2 · Product & hash',title:'Turn each n-gram into a hash',description:'Multiply IDs by position weights, then combine the resulting product blocks with XOR.',view:()=>'<div class="rows">'+[[2,[4,3]],[3,[4,3,2]],[4,[4,3,2,1]]].map(([n,ids])=>{const weights=[3,5,7,11].slice(0,n),products=ids.map((id,i)=>id*weights[i]);return '<div class="row"><span>'+n+'-gram</span>'+box('multiply · newest word first','<div class="product-list">'+ids.map((id,i)=>'<span class="product-term">'+id+'×'+weighted(weights[i],i)+' → '+productBlock(products[i],i)+'</span>').join('')+'</div>')+arrow+box(products.map(productBlock).join('<span class="xor-op"> XOR </span>'),'<span class="number">'+products.reduce((a,b)=>a^b)+'</span>')+'</div>'}).join('')+'</div>'},
{name:'3 · Lookup',title:'Use the hashes to retrieve memory',description:'Each n-gram hash feeds its memory tables. Each head selects one learned memory row.',view:()=>'<div class="lookup-matrix"><div class="lookup-column">'+[[2,3],[3,13],[4,6]].map(([n,h])=>'<div class="hash-card ngram-'+n+'"><small>'+n+'-gram hash</small><strong>'+h+'</strong></div>').join('')+'</div>'+arrow+'<div class="lookup-column">'+[2,3,4].map((n,i)=>memoryTableCard(n,i)).join('')+'</div>'+arrow+box('Concatenate memory vectors',combinedVector()+'<div class="memory-label">Memory <i>m</i></div>','accent')+'</div><div class="model-callout">DeepSeek V4.1 Flash · number of heads = <strong>8</strong><br><small>One embedding table per Engram layer, divided into 24 disjoint bucket ranges: 3 n-grams, 8 heads.</small></div>'},

{name:'4 · Transform & gate',title:'Let the hidden state control the memory',description:'First, a learned matrix multiplication projects the memory into a key and value. The key then matches the hidden state <i>x</i> to decide how much value to pass.',view:()=>'<div class="flow gate-flow">'+ioBox('Input','<div class="signal-stack">'+combinedVector(true)+signalVector('hidden','Hidden state x')+'</div>')+arrow+'<div class="block gate-block"><span class="label">Gated transformation</span><div class="gate-graph"><div class="gate-path"><span class="gate-node memory-node">memory <i>m</i></span><b>→</b><span class="gate-node">linear projection<br><strong>[K; V] = m × W<sub>KV</sub><sup>T</sup></strong></span><b>→</b><span class="split-node"><i>K</i><i>V</i></span></div><div class="gate-path compare"><span class="input-pair"><span class="gate-node hidden-node">x</span><span class="gate-node key-node">K</span></span><b>→</b><span class="gate-node math-node">norm-dot(x, K) = Σ(x ⊙ w ⊙ K) / (RMS(x) · RMS(K) · √d)</span><b>→</b><span class="gate-node scalar-node s-node">s</span></div><div class="gate-path"><span class="gate-node math-node">σ(sign(s)√|s|)</span><b>→</b><span class="gate-node scalar-node g-node">g</span></div><div class="gate-path result-row"><span class="gate-node scalar-node g-node">g</span><b>×</b><span class="gate-node raw-value-node">V</span><b>→</b><span class="gate-node value-node">gV</span></div></div></div>'+arrow+ioBox('Output','<div class="output-symbol">gV</div>'+signalVector('gated','Gated memory'),'accent')+'</div>'},
{name:'5 · Inject',title:'Add the memory at fox’s position',description:'Add the gated memory vector to the hidden-state vector, then continue through the transformer.',view:()=>sentence()+'<div class="flow inject-flow">'+box('before',signalVector('hidden','Hidden state x')+'<div class="tensor-name">x</div>')+'<div class="arrow">+</div>'+box('contribution',signalVector('gated','Gated memory')+'<div class="tensor-name">gV</div>')+'<div class="arrow">=</div>'+box('after',signalVector('updated','Updated hidden state')+'<div class="tensor-name">x′ = x + gV</div>','accent')+'</div>'}
];
let current=0,playing=false,timer;const $=id=>document.getElementById(id);
function render(){const s=steps[current];$('example').hidden=current>=2;$('follow-note').hidden=current!==0;$('title').textContent=s.title;$('description').innerHTML=s.description+(current===1?'<span class="weight-note">Example position weights: '+[3,5,7,11].map(weighted).join(', ')+'.</span><span class="fact-callout">In DeepSeek V4.1 Flash, each Engram layer uses layer-specific random odd integers as position weights. They are generated from a fixed seed, so the weights are deterministic and frozen—not learned.</span>':'');$('visual').innerHTML='<div class="stage">'+s.view()+'</div>';$('count').textContent=(current+1)+' / '+steps.length;$('scrub').value=current;$('prev').disabled=current===0;$('next').disabled=current===steps.length-1;$('nav').innerHTML=steps.map((s,i)=>'<button data-step="'+i+'" class="'+(i===current?'active':'')+'" aria-current="'+(i===current?'step':'false')+'">'+s.name+'</button>').join('');document.querySelectorAll('[data-hash]').forEach(b=>b.onclick=()=>{stop();lookupFocus=Number(b.dataset.hash);render()});document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>go(Number(b.dataset.step)));}
function stop(){playing=false;clearTimeout(timer);$('play').textContent='▶ Play'}function go(i){stop();current=Math.max(0,Math.min(steps.length-1,i));render()}function tick(){timer=setTimeout(()=>{if(!playing)return;if(current===steps.length-1){stop();return}current++;render();tick()},8000)}function toggle(){if(playing){stop();return}if(current===steps.length-1){current=0;render()}playing=true;$('play').textContent='Ⅱ Pause';tick()}
$('prev').onclick=()=>go(current-1);$('next').onclick=()=>go(current+1);$('play').onclick=toggle;$('scrub').oninput=e=>go(Number(e.target.value));document.addEventListener('keydown',e=>{if(['BUTTON','INPUT'].includes(e.target.tagName))return;if(e.key==='ArrowRight'){e.preventDefault();go(current+1)}if(e.key==='ArrowLeft'){e.preventDefault();go(current-1)}if(e.code==='Space'){e.preventDefault();toggle()}});render();
</script></body></html>
